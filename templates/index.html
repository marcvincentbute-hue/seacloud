<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaCloud - Ferry Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/homepage.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">SeaCloud</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/feedback">Feedback</a>
            <button class="btn-login" onclick="window.location.href='/login'">Sign In</button>
            <button class="btn-register" onclick="window.location.href='/register'">Register</button>
        </div>
    </nav>

    <div class="hero">
        <h1>Book your <span>ferry tickets</span></h1>
        <p>Plan your trip to beautiful islands in the Philippines</p>
    </div>

    <div class="booking-container">
        <div class="booking-tabs">
            <button class="tab active">One way</button>
        </div>

        <form class="booking-form" onsubmit="searchTrips(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>From</label>
                    <select id="searchFrom" required>
                        <option value="">Island, city or port</option>
                        <option value="Butuan Port">Butuan Port</option>
                        <option value="Magallanes">Magallanes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>To</label>
                    <select id="searchTo" required>
                        <option value="">Island, city or port</option>
                        <option value="Butuan Port">Butuan Port</option>
                        <option value="Magallanes">Magallanes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Depart</label>
                    <input type="date" id="searchDate" required>
                </div>
            </div>

            <div class="weather-section">
                <h3>Weather at Ports</h3>
                <div id="weatherButuan" class="weather-card">
                    <div class="weather-loading">Loading weather data...</div>
                </div>
                <div id="weatherMagallanes" class="weather-card">
                    <div class="weather-loading">Loading weather data...</div>
                </div>
            </div>

            <!-- Passengers Section with counter -->
            <div class="passengers-section">
                <div class="passenger-item" onclick="togglePassengerModal()">
                    <span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-people-fill" viewBox="0 0 16 16" style="display: inline; margin-right: 8px;">
                            <path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5.784 6A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/>
                        </svg>
                        Passengers, pets & vehicles
                    </span>
                    <span id="passengerSummary">1 adult</span>
                </div>

                <!-- Passenger Modal (hidden by default) -->
                <div id="passengerModal" class="passenger-modal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>Passengers</h3>
                            <button type="button" class="close-modal" onclick="togglePassengerModal()">×</button>
                        </div>
                        <div class="passenger-row">
                            <div>
                                <strong>Adults</strong>
                                <small>Age 13+</small>
                            </div>
                            <div class="counter">
                                <button type="button" onclick="updatePassengers('adults', -1)">-</button>
                                <span id="adultsCount">1</span>
                                <button type="button" onclick="updatePassengers('adults', 1)">+</button>
                            </div>
                        </div>
                        <div class="passenger-row">
                            <div>
                                <strong>Children</strong>
                                <small>Age 4-12</small>
                            </div>
                            <div class="counter">
                                <button type="button" onclick="updatePassengers('children', -1)">-</button>
                                <span id="childrenCount">0</span>
                                <button type="button" onclick="updatePassengers('children', 1)">+</button>
                            </div>
                        </div>
                        <div class="passenger-row">
                            <div>
                                <strong>Infants</strong>
                                <small>Age 0-3</small>
                            </div>
                            <div class="counter">
                                <button type="button" onclick="updatePassengers('infants', -1)">-</button>
                                <span id="infantsCount">0</span>
                                <button type="button" onclick="updatePassengers('infants', 1)">+</button>
                            </div>
                        </div>
                        <div class="passenger-row">
                            <div>
                                <strong>Pets</strong>
                            </div>
                            <div class="counter">
                                <button type="button" onclick="updatePassengers('pets', -1)">-</button>
                                <span id="petsCount">0</span>
                                <button type="button" onclick="updatePassengers('pets', 1)">+</button>
                            </div>
                        </div>
                        <button type="button" class="btn-done" onclick="togglePassengerModal()">Done</button>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="search-btn">Search</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/homepage.js') }}"></script>
</body>
</html>
