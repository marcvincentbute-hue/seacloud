<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaCloud - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo-wrapper" onclick="window.location.href='/'" style="display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none;">
            <div style="width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #00b8d4, #0077b6); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2">
                    <path d="M2 12c1.5-2 3.5-3 5.5-1s4 2 5.5 0 3.5-1 5.5 1" />
                    <path d="M2 17c1.5-2 3.5-3 5.5-1s4 2 5.5 0 3.5-1 5.5 1" />
                    <path d="M9 5l3-3 3 3" />
                    <path d="M12 2v10" />
                </svg>
            </div>
            <span style="font-size: 24px; font-weight: 800; font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #00e5ff, #0077b6); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0; line-height: 1;">
                SeaCloud
            </span>
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <button class="btn-login" onclick="window.location.href='/login'">Sign In</button>
            <button class="btn-register" onclick="window.location.href='/register'">Register</button>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-box">
            <div class="logo"></div>
            <h2>SeaCloud</h2>
            <h3>Login</h3>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>

                <div class="footer-link" style="text-align: right; margin-top: 5px;">
                    <a href="/forgot-password" style="color: #00e5ff; font-size: 12px; text-decoration: none;">Forgot Password?</a>
                </div>
                
                <button type="submit">Sign In</button>
            </form>

            <div id="message" class="message"></div>

            <div class="footer-link">
                <a href="/register">Don't have an account? Register here</a>
            </div>

            <div class="features">
                <p>Book pumpboat trips online</p>
                <p>Real-time seat availability</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
