<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaCloud - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">SeaCloud</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/feedback">Feedback</a>
            <button class="btn-login" onclick="window.location.href='/login'">Sign In</button>
            <button class="btn-register" onclick="window.location.href='/register'">Register</button>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-box">
            <div class="logo"></div>
            <h2>SeaCloud</h2>
            <h3>Login</h3>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>

                <div class="footer-link" style="text-align: right; margin-top: 5px;">
                    <a href="/forgot-password" style="color: #00e5ff; font-size: 12px; text-decoration: none;">Forgot Password?</a>
                </div>
                
                <button type="submit">Sign In</button>
            </form>

            <div id="message" class="message"></div>

            <div class="footer-link">
                <a href="/register">Don't have an account? Register here</a>
            </div>

            <div class="features">
                <p>Book ferry tickets online</p>
                <p>Real-time schedule updates</p>
                <p>Secure payment options</p>
                <p>Rate your travel experience</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
