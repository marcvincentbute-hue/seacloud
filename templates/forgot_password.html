<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaCloud - Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot.css') }}">
</head>
<body>
    <div class="form-container">
        <div class="logo-container">
            <div class="sea-icon"></div>
            SeaCloud
            <div class="subtitle">Forgot Password</div>
        </div>

        <form class="form" id="forgotForm" onsubmit="handleForgotPassword(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
            </div>

            <button class="form-submit-btn" type="submit">Send Reset Link</button>
        </form>

        <div id="message" class="message"></div>

        <p class="login-link">
            Remember your password?
            <a href="/login" class="link">Back to Login</a>
        </p>
    </div>

    <script src="{{ url_for('static', filename='js/forgot.js') }}"></script>
</body>
</html>
